# Skeleton — reconciles the shared workload set on the ephemeral overlay.
# EKS-specific patches (IRSA service-account annotations, storage class) are
# layered as a kustomize overlay here once the stand-up scripts exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
