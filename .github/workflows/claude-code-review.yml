# ============================================================================
# Claude Code — Automated PR Review
# ============================================================================
# Thin wrapper around lentago/shared-workflows/claude-review.yml.
# Pinned to Haiku.
#
# >>> CUSTOMIZE THE review_prompt BELOW FOR THIS REPO. <<<
# Do NOT ship the placeholder. A copy-pasted prompt that describes the wrong
# repo is worse than none — it points the reviewer at the wrong rubric. The
# good fleet examples (betula, drosera,
# reference-checker) each describe their OWN content.
# Also review `paths-ignore`: if markdown is this repo's product, do NOT
# ignore "*.md".
# ============================================================================

name: Claude Code Review

# >>> DISABLED 2026-06-25: automated Claude PR review turned off fleet-wide.
# Trigger changed from `pull_request` to manual `workflow_dispatch` only, so it
# never auto-runs on PRs. The repo-specific review_prompt below is preserved.
# To re-enable, restore the `on: pull_request` trigger (see git history).
on:
  workflow_dispatch:

jobs:
  claude-review:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: lentago/shared-workflows/.github/workflows/claude-review.yml@main
    secrets: inherit
    with:
      review_prompt: |
        osmunda is the Lentago Labs Kubernetes platform: GitOps-managed manifests
        (Flux) for a standing k3s lab cluster plus an ephemeral EKS overlay, with
        n8n as the first migrated workload. The content is Kubernetes YAML,
        Flux/kustomize configuration, ADRs, and runbooks — there is no build step
        and CI validates rather than deploys. Focus the review on:

        - **Manifest correctness** — valid apiVersion/kind, resolvable
          selectors↔labels, sane probes/resources; would `kubeconform` and a real
          apply accept this?
        - **GitOps wiring** — Flux `Kustomization` paths, `sourceRef`, and
          `dependsOn` ordering (infrastructure before apps); pull-based only, no
          CI-push deploy sneaking in.
        - **Image & supply-chain pinning** — images pinned by `@sha256:` digest
          (tag as comment, kept in sync); CI actions SHA-pinned; binary downloads
          checksum-verified.
        - **Cost gate** — anything touching the EKS overlay must preserve the
          "never leave the control plane up idle" rule and keep the ~$0.10/h cost
          flagged as the free-tier exception.
        - **k3s storage reality** — node-local ReadWriteOnce volumes imply
          single-replica + Recreate for PVC-backed workloads; flag rollouts that
          would break that.
        - **Framing & docs** — comparative, fit-for-this-lab framing (no
          correctness/novelty claims in public copy); n8n manifests stay clearly
          marked pre-cutover; relative markdown links resolve.
