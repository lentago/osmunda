# PRE-CUTOVER DRAFT — n8n is still live on LXC 113. Do not point real traffic
# here until the migration runbook says so. The image is digest-pinned; the
# webhook host URL, Postgres connection, and N8N_ENCRYPTION_KEY are supplied at
# cutover via a Secret + ConfigMap (not in this draft, which runs SQLite on the
# PVC). Single replica + Recreate: the data PVC is ReadWriteOnce and node-local.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/part-of: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: n8n
          # tag 2.35.3 — digest-pinned so the deployed bits never drift from
          # the reviewed ones. Bump both the tag comment and the digest together.
          image: docker.n8n.io/n8nio/n8n@sha256:31375a4f730081a139bba2d379bf2efaa8e662cc9e131d12bb5e15859d4f0282
          # Read-only root: n8n writes outside its data dir in exactly two
          # places, each on an emptyDir below. Boot compiles the editor assets
          # into ~/.cache/n8n/public (without it, start dies with ENOENT mkdir
          # /home/node/.cache), and /tmp holds upload scratch. Verified against
          # 2.35.3 with docker diff (boot plus a Code-node run). Re-check on
          # every image bump; a new write path is a CrashLoopBackOff.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 5678
          env:
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: "http"
            # N8N_HOST / WEBHOOK_URL / DB_* / N8N_ENCRYPTION_KEY land at cutover.
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /home/node/.cache
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              # 512Mi proved too tight on first deploy: V8 sized its heap off
              # the cgroup limit and the editor OOM-crashed at ~250MB during
              # boot (CrashLoopBackOff). 1Gi matches what the workload showed
              # it needs; nodes are 6GiB so this is comfortable.
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
        # Both emptyDirs sit on node-local disk; sizeLimit bounds them so a
        # runaway write evicts this pod instead of filling the node.
        - name: tmp
          emptyDir:
            # Upload scratch (n8nDataTableUploads), a few KiB at boot. Revisit
            # at cutover against the real workflows from LXC 113.
            sizeLimit: 1Gi
        - name: cache
          emptyDir:
            # Compiled editor assets, ~63MiB, regenerated on every start.
            sizeLimit: 256Mi
