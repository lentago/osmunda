# Host is a placeholder for the lab. TLS (cert-manager) and any auth
# annotations are wired at cutover; see infra/ingress-nginx.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n
  namespace: n8n
  labels:
    app.kubernetes.io/name: n8n
spec:
  # traefik: k3s's bundled ingress controller. The infra/ notes still plan an
  # ingress-nginx graduation; this switches back when that HelmRelease lands —
  # an Ingress pointing at a class with no controller serves nothing.
  ingressClassName: traefik
  rules:
    - host: n8n.lab.lentago.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  name: http
